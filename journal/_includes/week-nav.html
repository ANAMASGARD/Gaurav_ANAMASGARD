<nav class="week-nav-shell" aria-label="GSoC weekly journal navigation">
  <div class="week-nav">
    <a class="week-nav-link" data-week="1" href="/journal/week-1/">Week 1</a>
    <a class="week-nav-link" data-week="2" href="/journal/week-2/">Week 2</a>

    <a class="week-nav-link" data-week="11" href="/journal/week-11/">Week 11</a>
    <a class="week-nav-link" data-week="12" href="/journal/week-12/">Week 12</a>
    <a class="week-nav-link" data-entry="final" href="/journal/final-submission/">Final</a>
  </div>
</nav>
<script>
(() => {
  const path = window.location.pathname;
  const match = path.match(/\/journal\/week-(\d+)\/?$/);
  const activeWeek = /\/journal\/?$/.test(path) ? "1" : (match ? match[1] : null);
  const activeLink = /\/journal\/final-submission\/?$/.test(path)
    ? document.querySelector('.week-nav-link[data-entry="final"]')
    : document.querySelector(`.week-nav-link[data-week="${activeWeek}"]`);
  if (!activeLink) return;

  activeLink.classList.add("is-active");
  activeLink.setAttribute("aria-current", "page");

  if (activeLink.scrollIntoView && window.matchMedia("(max-width: 767px)").matches) {
    activeLink.scrollIntoView({ block: "nearest", inline: "center" });
  }
})();
</script>
